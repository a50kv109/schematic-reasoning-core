name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run deterministic test suite
        run: npm test
      - name: Build and verify portable ZIP
        run: npm run package
      - name: Check archive and checksum
        run: |
          unzip -t outputs/packages/schematic-reasoning-core-v0.3.0.zip
          cd outputs/packages
          sha256sum -c schematic-reasoning-core-v0.3.0.zip.sha256
